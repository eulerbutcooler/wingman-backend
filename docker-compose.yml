services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

    # Swapped MinIO for SeaweedFS (Full Free Open Source S3 Alternative)
  minio:
    image: chrislusf/seaweedfs:latest
    ports:
      - "9000:8333" # S3 API endpoint maps to your application's 9000 port
      - "9001:9001" # Web Console maps to port 9001
    command: 'server -s3 -s3.port=8333 -filer -master.volumeSizeLimitMB=1024'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-time script to automatically create your bucket on startup
  minio-init:
    image: alpine:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      apk add --no-cache curl;
      curl -X PUT http://minio:8333/course-files;
      "

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: -js -sd /data
    volumes:
      - nats_data:/data

  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=aeromentor
      - POSTGRES_PASSWORD=aeromentor
      - POSTGRES_DB=aeromentor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  qdrant_data:
  minio_data:
  nats_data:
  postgres_data:
  redis_data:
